<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap: primeros pasos</title>
  <!-- 1. El CSS de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2. Tus ajustes, SIEMPRE después -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Menú que se colapsa en el celular -->
  <nav class="navbar navbar-expand-md bg-body-tertiary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">🍯 Mieles del Oriente</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#beneficios">Beneficios</a></li>
          <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="text-center mb-4">La pizza de 12 porciones</h1>

    <div class="row g-3 mb-4">
      <div class="col-6"><div class="p-3 bg-success-subtle rounded">col-6</div></div>
      <div class="col-6"><div class="p-3 bg-success-subtle rounded">col-6</div></div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-4"><div class="p-3 bg-warning-subtle rounded">col-4</div></div>
      <div class="col-4"><div class="p-3 bg-warning-subtle rounded">col-4</div></div>
      <div class="col-4"><div class="p-3 bg-warning-subtle rounded">col-4</div></div>
    </div>

    <h2 class="mb-3">Las tallas S, M, L</h2>
    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4"><div class="p-3 bg-info-subtle rounded">A</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="p-3 bg-info-subtle rounded">B</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="p-3 bg-info-subtle rounded">C</div></div>
    </div>

    <section id="beneficios" class="mt-5">
      <h2 class="mb-3">Beneficios</h2>
      <article class="card h-100">
        <div class="card-body">
          <h3 class="h5 card-title">🐝 100 % natural <span class="badge text-bg-success">Nuevo</span></h3>
          <p class="card-text">Sin azúcar ni aditivos.</p>
        </div>
      </article>

      <div class="mt-3">
        <a class="btn btn-primary" href="#">Principal</a>
        <a class="btn btn-outline-primary" href="#">Secundario</a>
        <div class="alert alert-warning mt-3" role="alert">⚠️ Quedan pocas unidades.</div>
      </div>
    </section>

    <section id="contacto" class="mt-5">
      <h2 class="mb-3">Contacto</h2>
      <form class="row g-3">
        <div class="col-12 col-md-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
      </form>
    </section>
  </main>

  <!-- 3. El JS de Bootstrap (para el menú del celular) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
